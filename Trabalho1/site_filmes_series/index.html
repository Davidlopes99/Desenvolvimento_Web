<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home - Filmes e Séries</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Filmes & Séries</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="filmes.html">Filmes</a></li>
          <li class="nav-item"><a class="nav-link" href="series.html">Séries</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container mt-5 pt-4">
    <h1 class="mb-4">Bem-vindo ao nosso catálogo!</h1>
    <h2>Filmes Populares</h2>
    <div class="carousel slide mb-5" id="carouselFilmes" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="assets/img/filme1.jpg" class="d-block w-100" alt="Filme 1">
        </div>
        <div class="carousel-item">
          <img src="assets/img/filme2.jpg" class="d-block w-100" alt="Filme 2">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselFilmes" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselFilmes" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
    <h2>Séries Populares</h2>
    <div class="carousel slide mb-5" id="carouselSeries" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="assets/img/serie1.jpg" class="d-block w-100" alt="Série 1">
        </div>
        <div class="carousel-item">
          <img src="assets/img/serie2.jpg" class="d-block w-100" alt="Série 2">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselSeries" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselSeries" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
